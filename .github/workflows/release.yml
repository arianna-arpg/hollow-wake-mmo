# ---------------------------------------------------------------------------------------------
# RELEASE: push a version tag and this builds and publishes it.
#
#   git tag -a v0.2.0 -m "What changed, for players"   # the tag message becomes the release notes
#   git push origin v0.2.0
#
# The tag names the version (vX.Y.Z; a pre-release suffix such as v0.2.0-rc.1 publishes a
# pre-release that only the nightly channel sees). The jobs are package.yml's: the client archives
# for Windows and Linux, manifest.json, the launcher installers, SHA256SUMS.txt, then one GitHub
# Release holding them all, published only once every job is green. A lightweight tag, or an
# annotated one with an empty message, gets notes generated by GitHub.
#
# Dry runs build everything and keep it as workflow artifacts, publishing nothing: run it by hand
# (workflow_dispatch), and every pull request that touches the release pipeline runs one, so a
# broken pipeline shows up on the pull request instead of on release day.
# ---------------------------------------------------------------------------------------------
name: release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - launcher/**
      - scripts/package-client.sh
      - src/HollowWake.Client/export_presets.cfg
      - src/HollowWake.Client/HollowWake.Client.csproj
      - .github/workflows/package.yml
      - .github/workflows/release.yml
      - .github/workflows/nightly.yml
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp on the dry-run builds (nothing is published)
        type: string
        default: 0.0.0-dryrun

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
      publish: ${{ steps.meta.outputs.publish }}
      notes: ${{ steps.meta.outputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - name: Version, channel and notes from the tag
        id: meta
        env:
          DRY_RUN_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            publish=true
          else
            dry="${DRY_RUN_VERSION:-0.0.0-dryrun.$GITHUB_RUN_NUMBER}"
            tag="v${dry#v}"
            publish=false
          fi
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$tag is not vX.Y.Z or vX.Y.Z-suffix"
            exit 1
          fi
          # A version with a pre-release part is a pre-release, which launchers offer on the
          # nightly channel only.
          channel=stable
          if [[ "$version" == *-* ]]; then channel=nightly; fi
          notes=""
          if [ "$publish" = true ]; then
            # actions/checkout can leave an annotated tag lightweight; fetch the tag object itself.
            git fetch --force --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            if [ "$(git cat-file -t "refs/tags/$tag")" = tag ]; then
              notes="$(git tag -l --format='%(contents)' "$tag" | sed '/^-----BEGIN [A-Z ]*SIGNATURE-----/,$d')"
            fi
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "channel=$channel"
            echo "publish=$publish"
            echo "notes<<HOLLOWWAKE_NOTES_END"
            printf '%s\n' "$notes"
            echo "HOLLOWWAKE_NOTES_END"
          } >> "$GITHUB_OUTPUT"
          echo "Building $tag ($channel), publish=$publish"

  package:
    needs: meta
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      tag: ${{ needs.meta.outputs.tag }}
      channel: ${{ needs.meta.outputs.channel }}
      notes: ${{ needs.meta.outputs.notes }}
      publish: ${{ needs.meta.outputs.publish == 'true' }}
