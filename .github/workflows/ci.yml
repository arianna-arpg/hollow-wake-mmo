name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore HollowWake.sln
      - name: Build
        run: dotnet build HollowWake.sln --no-restore -c Release
      - name: Validate content
        run: dotnet run --project src/HollowWake.Tools -c Release --no-build -- validate
      - name: Test
        run: dotnet test HollowWake.sln --no-build -c Release --logger "trx;LogFileName=results.trx"
      - name: Headless zone smoke
        run: dotnet run --project src/HollowWake.Tools -c Release --no-build -- load --x 0 --y 0 --ticks 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  launcher:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build (type-check)
        run: npm run build
      - name: Unit tests (feed, verified download, extraction, install)
        run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -f deploy/Dockerfile -t hollowwake-server:ci .
      - name: Image smoke
        run: |
          docker run --rm -d --name hollowwake-smoke -p 7777:7777 hollowwake-server:ci
          sleep 8
          docker logs hollowwake-smoke | tee /tmp/smoke.log
          grep -q "is up" /tmp/smoke.log
          docker stop hollowwake-smoke

  ci:
    # The one check main requires (branch protection): green only when every job above succeeded.
    needs: [build-test, launcher, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          test "$(jq -r '[.[].result] | all(. == "success")' <<<"$RESULTS")" = true
