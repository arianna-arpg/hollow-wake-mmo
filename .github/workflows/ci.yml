name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore Skein.sln
      - name: Build
        run: dotnet build Skein.sln --no-restore -c Release
      - name: Validate content
        run: dotnet run --project src/Skein.Tools -c Release --no-build -- validate
      - name: Test
        run: dotnet test Skein.sln --no-build -c Release --logger "trx;LogFileName=results.trx"
      - name: Headless zone smoke
        run: dotnet run --project src/Skein.Tools -c Release --no-build -- load --x 0 --y 0 --ticks 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -f deploy/Dockerfile -t skein-server:ci .
      - name: Image smoke
        run: |
          docker run --rm -d --name skein-smoke -p 7777:7777 skein-server:ci
          sleep 8
          docker logs skein-smoke | tee /tmp/smoke.log
          grep -q "is up" /tmp/smoke.log
          docker stop skein-smoke
