name: branches

# The weekly branch report. Lists every branch with commits main does not have, and how long each has
# lingered, in the job summary, and keeps one issue current with the same table so neither engineer has
# to remember to look; when nothing lingers the issue is closed until something does. scripts/branches.sh
# prints the same locally. What to do about what it lists: docs/COLLABORATION.md, "Branch life".

on:
  schedule:
    - cron: '17 9 * * 1' # Mondays, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: branches
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report
        id: report
        run: |
          scripts/branches.sh --remote-only --no-fetch --markdown > report.md
          echo "count=$(scripts/branches.sh --remote-only --no-fetch --count)" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report issue current
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.report.outputs.count }}
          TITLE: 'Branch report: work not on main'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            cat report.md
            echo
            echo "Each engineer answers for its own branches here: merge, split or delete, not leave (docs/COLLABORATION.md, Branch life). Updated weekly by [the branches workflow]($RUN_URL); \`scripts/branches.sh\` prints the same locally."
          } > body.md
          issue=$(gh issue list --state all --search "in:title \"$TITLE\"" --json number,title --jq "map(select(.title == \"$TITLE\")) | sort_by(.number) | last | .number // empty")
          if [ -z "$issue" ]; then
            if [ "$COUNT" != 0 ]; then
              gh issue create --title "$TITLE" --body-file body.md
            else
              echo "Nothing lingers, and there is no report issue to update."
            fi
            exit 0
          fi
          state=$(gh issue view "$issue" --json state --jq .state)
          gh issue edit "$issue" --body-file body.md
          if [ "$COUNT" = 0 ] && [ "$state" = OPEN ]; then
            gh issue close "$issue" --comment "Nothing lingers this week. The report reopens when something does."
          elif [ "$COUNT" != 0 ] && [ "$state" = CLOSED ]; then
            gh issue reopen "$issue"
          fi
