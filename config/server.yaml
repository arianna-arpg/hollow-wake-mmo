# Hollow Wake MMO server settings. Copy to server.local.yaml for machine-specific overrides (ignored by git).
name: Hollow Wake MMO Dev
motd: A quiet corner of the Weftmarches.
port: 7777
bind: 0.0.0.0
transport: tcp
tick_rate: 20
snapshot_rate: 10
interest_radius: 48
snapshots:                # what each client is sent and how precisely (defaults shown; docs/design/networking-and-persistence.md)
  refresh_seconds: 2      # a changed entity is resent in full once it goes quiet; static entities are re-verified
  sweep_seconds: 10       # every known dynamic entity is resent in full regardless
  self_seconds: 0.5       # how often the self state is checked for change; cooldowns count down in these steps
  self_max_seconds: 2     # the longest a client goes without a self state
  resource_step: 0.02     # a resource counts as changed in steps of this fraction of its maximum
  cast_steps: 5           # cast progress counts as changed in this many steps per cast
  interest_height: 64     # how far above and below a player interest reaches
content_layers:
  - content/core
strict_content: true
data_dir: data
# seed: aureth          # overrides world.seed from the rules
auth: dev               # dev: any account name; token: require the shared token below
# token: change-me
max_players: 64
autosave_seconds: 60
zone_unload_seconds: 300
world_events: true
world_event_interval_seconds: 900
max_active_world_events: 3
log_intents: false
