# Game rules: every formula and tunable the engine reads by path.
# Code never hard-codes a number it could read from here. Expressions are text; numbers are numbers.
kind: rules
entries:
  - id: world
    values:
      seed: aureth
      chunk_size: 32
      zone_chunks: 8
      region_zones: 8
      sea_level: 0
      resource_respawn_seconds: 180
      gen:
        continent_scale: 2400
        continent_amplitude: 28
        ridge_amplitude: 40
        detail_scale: 40
        detail_amplitude: 3
        temperature_scale: 2200
        moisture_scale: 1600
        thread_scale: 900
        lapse_rate: 0.006
        level_per_region: 4
        poi_cell: 64
        poi_margin: 20
        poi_target: 4
        flatten_falloff: 6
        max_walkable_slope: 1.1
        shallow_depth: 0.6
        flora_jitter: 0.4

  # The calendar (docs/design/world/landscape.md): how long a day lasts in seconds of world time, and the fraction of
  # the day a new world wakes at. Every zone shares the one day; the clients draw the sky from the fraction the
  # server sends, so a rule that reads the time of day and the sky a player sees always agree.
  - id: landscape
    values:
      day_length_seconds: 1800
      day_start: 0.3

  - id: server
    values:
      tick_rate: 20
      zone_chunk_padding: 1
      max_intents_per_tick: 8
      interest_radius: 48
      snapshot_rate: 10

  - id: combat
    values:
      hit_chance: "clamp(accuracy / max(1, accuracy + evasion * 0.25), 0.05, 1)"
      # Reduction of a Stone hit by armor: the target's armor, the hit's raw amount, the target's level and the
      # attacker's armor penetration (pen, a fraction of armor ignored). The clamp is part of the rule.
      armor_reduction: "clamp(armor * (1 - pen) / (armor * (1 - pen) + 10 * raw), 0, 0.9)"
      resist_cap: 0.75
      resist_floor: -2
      # The pools hits reach before life, in order, then life. The interface lists the ones before life.
      pools: [insight, poise, ward, shield, life]
      # What each pool does. Pools absorb by default (at most fraction of what reaches them); a break bar
      # (kind: break) never absorbs, loses each landing hit times the attacker's dealt attribute times its own
      # taken attribute, and breaks when emptied. on_hurt is applied when a landing hit reaches a pool the body
      # holds, on_break when a hit empties it, rearm marks re-arming; with states the pool keeps the flags
      # pool.<id>.broken, pool.<id>.rearming and pool.<id>.recharging (stamped when they begin).
      pool_rules:
        insight: { states: true }
        poise: { kind: break, dealt: poise.damage, taken: poise.damage.taken, on_break: poise_broken, rearm: poise_rearming, states: true }
        ward: { states: true }
        shield: { on_hurt: shield_delay, states: true }
      evadable_tags: [attack]
      # Evasion rolls for each evadable hit (roll), or accumulates on the target so it lands on schedule (entropy).
      evasion: roll
      # A block keeps 1 - block.amount of the hit (fraction), or stops up to block_value, never more than
      # block.power of the hit (guard). A blocked hit inflicts no statuses when block_stops_ailments holds.
      block: fraction
      block_value: "10 + level * 2 + block.value"
      block_stops_ailments: true
      # The status a stagger banks deferred damage into, and the one that keeps a body from cheating death twice.
      stagger_status: stagger
      cheat_death_status: death_cheated
      default_thread: stone
      cooldown_at: complete
      global_cooldown: 0
      corpse_seconds: 12
      respawn_seconds: 5
      respawn_life_fraction: 1
      auto_respawn: true
      crit_ailment_bonus: 0.5
      propagate_radius: 4
      # The defender's ladder every hit walks, by registered stage name.
      stages: [immunity, guard, evade, block, taken_as, mitigate, taken, cap, stagger, pools, cheat_death, cull, leech]
      # Stages, declared steps (crit, armor, added, damage_taken, ailments) and break bars (poise) that hits
      # carrying a tag skip: { tag: [name, ...] }. Damage over time (status ticks carry dot) is neither guarded,
      # evaded nor blocked, never crits, ignores armor, takes no added damage, breaks no poise and leaves no
      # statuses; resistances still apply. Deferred damage (a stagger paying out) was mitigated when it landed, so it
      # skips everything up to the pools. Payloads tagged no_crit never crit.
      stage_skips:
        dot: [guard, evade, block, crit, armor, added, poise, ailments]
        deferred: [guard, evade, block, crit, added, taken_as, mitigate, damage_taken, cap, stagger, poise, leech, ailments]
        no_crit: [crit]
      # Victim tags beyond the struck body's own tags, flags and statuses: each adds vs.<key> to a hit when its
      # expression holds in the hit scope (target.*, source.*, distance, angle: zero in front, 180 behind). Every
      # rule is read on every hit, so the core lists the ones content scopes by; more axes are one line each
      # (near: "distance <= 3", higher_level: "target.level > source.level").
      victim_tags:
        low_life: "target.life_pct <= target.low_life.line"
        full_life: "target.life_pct >= target.full_life.line"
        behind: "angle > 120"
      # How many of a body's latest casts has("combo_varied") (all different weaves) and has("combo_repeated") (all
      # the same weave) look back over.
      combo_casts: 3
      ailment_magnitude:
        burning: "amount * 0.3"
        bleeding: "amount * 0.25"
        chilled: "1"
        shocked: "1"
        withered: "amount * 0.15"
        dazzled: "1"
        unraveling: "1"
        addled: "1"
        sapped: "amount * 0.2"

  - id: attributes
    values:
      # Stat trades: gain rate of one attribute as flat another while forgoing a fraction of the first. rate and
      # forgo name attributes (the dials) that any modifier turns; a trade is inert while its dials read zero.
      trades:
        - { from: life.max, to: shield.max, rate: trade.life_to_shield, forgo: trade.life_to_shield.forgo }

  - id: procs
    values:
      # Procs, status riders and consumed stacks are refused at this effect depth and deeper; below it each
      # level of depth keeps depth_falloff of a proc's chance (a proc may name its own falloff).
      max_depth: 3
      depth_falloff: 0.5
      # No proc's chance per event goes above this.
      chance_cap: 1

  - id: glyphs
    values:
      # The highest level a glyph reaches; references above it are clamped and validation refuses them.
      max_level: 20

  - id: triggers
    values:
      # How near a death must happen, in units, for a death_near subscriber to hear of it.
      death_near_radius: 8

  - id: move
    values:
      gravity: 24
      jump_velocity: 7.5
      step_up: 0.6
      max_drop: 3
      default_speed: 4.5
      path_max_nodes: 4000
      # Destinations sent again every think, as the AI's chases and follows send them: a smaller search
      # budget, and plans kept until they run out, the goal moves this many cells away from the planned
      # goal, or they reach this age. A click plans afresh, on path_max_nodes.
      ai_path_max_nodes: 500
      ai_repath_distance: 2
      ai_repath_seconds: 1.5
      fall_damage_per_unit: 2
      fall_damage_threshold: 6

  - id: items
    values:
      tier_breaks: ["1", "8", "16", "26", "38", "52"]
      tier_names: ["", "Fine", "Grand", "Exalted", "Mythic", "Primeval"]
      implicit_tier_scale: 0.1
      unique_tier_scale: 0.12
      local_tier_scale: 0.12
      quality_bonus: 0.2
      defense_budget: "(16 + 5 * item_level) * (1 + 0.3 * (tier - 1)) * slot_budget * (0.9 + 0.2 * base_roll)"
      slot_budget:
        chest: 1.0
        head: 0.65
        hands: 0.5
        feet: 0.5
        belt: 0.4
        off_hand: 0.6
      affix:
        tier_bias_low: 0.85
        tier_bias_high: 0.5
      rare_names:
        first: [Storm, Grim, Ember, Dusk, Iron, Blood, Gale, Hollow, Raven, Frost, Dread, Sun, Ash, Viper, Oath, Thorn, Wolf, Doom, Star, Bone, Rune, Shade, Brine, Loom]
        second: [song, " Ward", " Grasp", " Veil", " Coil", " Mark", " Bite", " Crest", " Shroud", " Pledge", " Snare", " Brand", " Knell", " Husk", " Gyre", " Fang", " Weave", " Keep", " Whorl", " Call"]
      loot:
        max_depth: 8
        owner_seconds: 60
        expire_seconds: 600
        pickup_range: 2.5

  - id: progression
    values:
      xp_to_next: "round(80 * level ^ 1.6)"
      passive_points: "level - 1"
      max_level: 60
      heal_on_level: true

  - id: quests
    values:
      max_active: 20
      level_slack: 3

  - id: crafting
    values:
      grace_seconds: 5
      rarity_by_quality:
        common: 0
        magic: 0.55
        rare: 0.85

  - id: territory
    values:
      min_level: 5
      bind_time: "30 + 15 * holding_founts"
      contestable: true
      damage_interrupts: true
      max_founts_per_character: 3
      yield_interval: 300

  - id: effects
    values:
      max_depth: 12
      # A cast of the host (cast { weave: host }) is refused inside this many host casts of the same weave: at
      # one, a weave whose hit casts itself lands that hit once more and its rerun casts nothing further.
      host_depth: 1

  - id: weaves
    values:
      max_slots: 8
