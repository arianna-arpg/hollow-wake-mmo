      insight: { fill: "#b88cf0", deep: "#3a2660" }
    resource_fallback: { fill: "#9a9a9a", deep: "#333333" }
    threads:
      ember: "#c4461a"
      tide: "#1f7fae"
      storm: "#7a52c4"
      stone: "#7a684e"
      bloom: "#3f8f3a"
      umbra: "#4e3f6e"
      lumen: "#b8960a"
      void: "#3b2a4a"
      mind: "#a03c90"
    rarities:
      normal: "#3a2c1f"
      magic: "#2747a8"
      rare: "#946200"
      unique: "#a33a12"
      champion: "#b5531a"
    notices:
      info: "#f6e7c1"
      levelup: "#ffd84d"
      quest: "#b6f0a8"
      event: "#e6b0ff"
      discovery: "#a8e6ff"
      error: "#ff9a8a"
    states:
      reserved: "#0a0606"
      broken: "#6d6d6d"
      dormant: "#8a8070"
      sealed: "#8a7a62"
      pip: "#c4461a"
      badge: "#8c1c13"
      cooldown: "#1a1008"
      fresh: "#b8860b"
      fit: "#2f6b2a"
      swap: "#a8780a"
      blocked: "#8c1c13"
