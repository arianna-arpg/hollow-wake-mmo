# Cosmetic line recipes shared by both clients. All geometry is local X east, Y north, Z up.
# Internal ember is a persisted Thread key; its player-facing name is Flame (Fire).
kind: ui_cast_visuals
entries:
  - id: default
    max_effects: 128
    max_event_age: 1.5
    max_preparation: 60
    profiles:
      - id: neutral
        match: []
        priority: 0
        color: "#e8dcc0"
        phases:
          start:
            seconds: 1
            size: 0.8
            height: 0.65
            opacity: 0.7
            segments: [[-0.5,0,0, -0.25,0,0.35], [0.5,0,0, 0.25,0,0.35]]
          release:
            seconds: 0.18
            size: 0.9
            height: 0.65
            expand: 0.6
            segments: [[0,0,0, 0.8,0,0], [0,0,0, 0.4,0,0.3]]
          impact:
            seconds: 0.15
            size: 0.6
            height: 0.6
            expand: 0.5
            segments: [[-0.5,0,0, 0.5,0,0], [0,0,-0.5, 0,0,0.5]]
          recovery:
            seconds: 0.3
            size: 0.6
            height: 0.5
            opacity: 0.5
            expand: 0.3
            segments: [[-0.5,0,0, -0.2,0,-0.2], [0.5,0,0, 0.2,0,-0.2]]
          cancel:
            seconds: 0.18
            size: 0.6
            height: 0.6
            opacity: 0.5
            expand: -0.6
            segments: [[-0.5,0,-0.1, -0.25,0,0.1], [0.5,0,-0.1, 0.25,0,0.1]]
      - id: flame
        match: [ember]
        priority: 10
        color: "#ffb45c"
        phases:
          start:
            seconds: 1
            size: 0.9
            height: 0.65
            opacity: 0.9
            spin: 0.35
            stroke: 0.085
            segments: [[-0.5,0,-0.2, -0.65,0,0.15], [-0.65,0,0.15, -0.3,0,0.5], [-0.3,0,0.5, -0.4,0,0.15], [0.5,0,-0.2, 0.65,0,0.15], [0.65,0,0.15, 0.3,0,0.5], [0.3,0,0.5, 0.4,0,0.15]]
          release:
            seconds: 0.2
            size: 1.1
            stroke: 0.07
            height: 0.65
            expand: 0.6
            segments: [[0,0,0, 1,0,0.15], [0.2,-0.2,0, 0.7,-0.12,0.2], [0.2,0.2,0, 0.7,0.12,0.2]]
          impact:
            seconds: 0.22
            stroke: 0.08
            size: 1
            height: 0.55
            expand: 0.8
            segments: [[0,0,0, 0.25,0,0.65], [0,0,0, -0.35,0,0.5], [0,0,0, 0.6,0,0.25], [0,0,0, -0.55,0,0.15], [0,0,0, 0,0.4,0.5], [0,0,0, 0,-0.4,0.5], [-0.12,0,0, 0.12,0,0]]
          recovery:
            seconds: 0.35
            size: 0.7
            height: 0.55
            opacity: 0.55
            expand: 0.45
            segments: [[-0.4,0,0, -0.55,0,0.2], [0.4,0,0.15, 0.55,0,0.35], [0.1,0,0.3, 0.05,0,0.5]]
