# Affix families. Tiers are best first; each tier lists one [min, max] range per line.
kind: affixes
entries:
  # ---- prefixes
  - id: vigorous
    name: Vigorous
    kind: prefix
    group: life
    names: [Stalwart, Hearty, Vigorous]
    weight: 10
    lines: [ { attribute: life.max, form: flat } ]
    tiers:
      - { level: 24, ranges: [[40, 60]], weight: 1 }
      - { level: 12, ranges: [[22, 38]], weight: 2 }
      - { level: 1, ranges: [[8, 20]], weight: 4 }
  - id: sturdy
    name: Sturdy
    kind: prefix
    group: defense
    names: [Bulwark, Reinforced, Sturdy]
    weight: 8
    requires: [armor, shield]
    lines: [ { attribute: armor, form: increased, local: true }, { attribute: evasion, form: increased, local: true } ]
    tiers:
      - { level: 24, ranges: [[0.5, 0.8], [0.5, 0.8]], weight: 1 }
      - { level: 12, ranges: [[0.3, 0.5], [0.3, 0.5]], weight: 2 }
      - { level: 1, ranges: [[0.12, 0.3], [0.12, 0.3]], weight: 4 }
  - id: keen
    name: Keen
    kind: prefix
    group: attack_damage
    names: [Savage, Honed, Keen]
    weight: 9
    requires: [weapon]
    excludes: [caster]
    themes: [martial]
    lines: [ { attribute: damage, form: increased, scope: [attack] } ]
    tiers:
      - { level: 20, ranges: [[0.35, 0.5]], weight: 1 }
      - { level: 10, ranges: [[0.2, 0.35]], weight: 2 }
      - { level: 1, ranges: [[0.08, 0.2]], weight: 4 }
  - id: arcane
    name: Arcane
    kind: prefix
    group: spell_damage
    names: [Loomwrought, Runed, Arcane]
