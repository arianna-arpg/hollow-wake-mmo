---
kind: uniques
entries:
  - id: the_last_stitch
    name: The Last Stitch
    base: staff
    weight: 1
    min_level: 8
    flavor: The Mender who carried it never finished the seam. Neither will you.
    lines:
      - { attribute: damage, form: increased, range: [0.4, 0.6], scope: [spell] }
      - { attribute: effect.duration, form: increased, range: [0.3, 0.5] }
      - { attribute: ailment.chance, form: flat, range: [0.3, 0.4] }
      - { attribute: life.max, form: increased, range: [-0.15, -0.1] }
  - id: greyheron_mantle
    name: Greyheron Mantle
    base: leather_jerkin
    weight: 1
    min_level: 6
    flavor: Cut from a sail that outran the Wake.
    lines:
      - { attribute: evasion, form: increased, range: [0.6, 0.9], local: true }
      - { attribute: move.speed, form: increased, range: [0.1, 0.15] }
      - { attribute: damage, form: more, range: [0.2, 0.3], condition: 'has("moving")' }
  - id: hedgecrow_band
    name: Hedgecrow Band
    base: ring
    weight: 1
    min_level: 4
    flavor: Hedgecrows wear them to remember whose door they were turned from.
    lines:
      - { attribute: crit.chance, form: flat, range: [0.05, 0.08] }
      - { attribute: damage, form: increased, range: [0.25, 0.4], scope: [vs.full_life] }
