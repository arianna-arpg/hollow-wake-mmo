# Rules of items, containers, passives and conversations: every number the inventory, rack, passive and
# dialogue systems read. Code reads them by path (inventory.bag.width) and keeps a default for each.
kind: rules
entries:
  - id: inventory
    values:
      # The hero's bag: a board of cells. A mask (rows of X and .) may switch cells off.
      bag:
        width: 12
        height: 5
      # The bases stones and codices are minted on, and how they are named ({name} is the glyph or weave).
      stone_base: glyph_stone
      codex_base: weave_codex
      names:
        stone: "{name} Stone"
        codex: "{name} Codex"
      # The sockets a codex gives its weave slot, by the codex's rarity (capped by what the form can hold).
      codex_sockets:
        common: 1
        magic: 2
        rare: 3
        unique: 4
      # Levels of freshly minted stones and codices, from the item level of the drop. Raising them is a station's work.
      stone_level: "1"
      codex_level: "1"
      codex_max_level: 20
      # How much more often a drop draws a glyph or form the dropper weaves with.
      drop_lean: 4
      # How far around the hero to look for a font, a stash or a station before checking each one's own reach.
      reach_search: 12
      # Trade. Prices are expressions of the item (value, item_level, rarity_rank, tier, quality, count) and the hero.
      vendor:
        price: "max(1, round((value + 2 + item_level) * (1 + rarity_rank * 1.5))) * count"
        sell_price: "max(1, floor((value + 1 + item_level * 0.5) * (1 + rarity_rank))) * count"
        buy_back_markup: 1
        restock_seconds: 1800
        sold_out_text: Sold out.
        cannot_afford_text: Not enough {currency}.
      # Labels of the preview lines on a weave's card.
      preview_labels:
        damage: Damage
        cast_time: Cast time
        cooldown: Cooldown
        cost: Cost
        range: Range
        crit: Critical chance

  - id: dialogue
    values:
      # How far a hero may stand from whoever they talk or trade with before the pane closes.
      reach: 6
      # How far a hero may stand from a station beyond its own reach.
      reach_slack: 1.5
      # How often departures are checked, in seconds.
      check_seconds: 0.5
      # The choice a line offers when none of its own is open.
      leave_text: Leave.

  - id: passives
    values:
      # What refunding one node costs at a font, per currency: expressions of the hero (level, wallet ...), the
      # node's cost (node_cost) and the refunds made so far (refunds).
      refund_cost:
        shards: "4 + level * 2 * node_cost + refunds"
      # Points of a realm's currency that levels give (beside those quests grant), as expressions of level.
      points:
        devotion: "0"

  # Heroes own their weaves: a set-weave must name what the rack seat holds (the codex, its stones in order,
  # attuned Threads). The casting rules declare the switch; the item model turns it on.
  - id: casting
    patch: true
    values:
      require_ownership: true
