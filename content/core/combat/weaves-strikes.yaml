# Strikes and melee: the prototype's blows ported as presets on the swing, whirl, sweep and thrust shells
# (forms-shells.yaml). Each preset carries its graph: a sector swept from the attacker's edge (area.angle scales
# the arc), a ring, a cone or a thrust, the weapon's dice times the preset's damage.effectiveness, and the riders
# the prototype gave it. The port ledger (docs/design/parity/port-ledger.md) says what each one was and what
# changed. The core Cleave form stands for the prototype's Cleave.
kind: weaves
entries:
  - id: heavy_strike
    name: "Heavy Strike"
    description: "A crushing melee blow: 35% chance to stun, and the victim is knocked back."
    form: swing
    threads: [stone]
    color: "#e09040"
    attributes:
      cast.time: 0.9
      cooldown.base: 2.5
      cost.base.stamina: 12
      damage.effectiveness: 2.22
      range: 1.56
      area.angle: 0.6
    ai: { role: damage, preferred_range: 1.72, weight: 3 }
    effects:
      - type: area
        shape: sector
        angle: 100
        radius: weave.range
        center: source
        reach: edge
        filter: enemy
        effects:
          - type: damage
            threads: $threads
            amount: "lerp(weapon.damage.min, weapon.damage.max, roll) * weave.damage.effectiveness * attack.power"
            tags: [hit]
          - { type: apply_status, status: stunned, chance: 0.35 }
          - { type: move, kind: knockback, distance: 2.81 }
