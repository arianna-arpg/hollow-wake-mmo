# Summoning forms: binding contracts, raising the dead, rites at a point, placing devices, laying snares and
# the blast a sprung snare looses, raising domes and ordering minions. Their preset weaves carry the summon,
# deploy and order effects; the summon form itself lives with the other forms.
kind: forms
entries:
  - id: bind
    name: Bind
    description: A binding contract. Its minions stay while their price is held, and return when they fall. Weave it again to let them go; its second face sends them at your mark.
    targeting: self
    cast_mode: cast
    cast_time: 1.0
    costs: { mana: 12 }
    cooldown: 3
    attributes: { range: 0, summon.count: 1, summon.max: 1 }
    mechanisms: [summon, spell]
    tags: [spell, summon, persistent]
    max_glyphs: 3
    meta_action: { weave: command_assault, label: "Attack!" }

  - id: raise
    name: Raise
    description: Raise a corpse where you point, as what it was. Without a corpse in reach the weave is not woven.
    targeting: ground
    cast_mode: cast
    cast_time: 0.9
    costs: { mana: 16 }
    cooldown: 1
    attributes: { range: 10, summon.count: 1, summon.max: 3 }
    target: { kind: corpse, search_radius: 4, consume: true }
    mechanisms: [summon, spell]
    tags: [spell, summon, corpse]
    max_glyphs: 3
    ai: { role: summon, preferred_range: 6, weight: 0.5 }

  - id: offering
    name: Offering
    description: Spend one of your own minions where you point.
    targeting: any
    cast_mode: cast
    cast_time: 0.5
    costs: { mana: 6 }
    cooldown: 3
    attributes: { range: 12 }
    target: { kind: minion, search_radius: 3 }
    mechanisms: [spell]
    tags: [spell, minion]
    max_glyphs: 2

  - id: rite
    name: Rite
    description: A rite worked at a point; what it does is the weave's own.
    targeting: ground
    cast_mode: cast
    cast_time: 0.6
    costs: { mana: 8 }
    cooldown: 2
    attributes: { range: 10 }
    mechanisms: [spell]
    tags: [spell, rite]
    min_threads: 0
    max_glyphs: 2

  - id: totem
    name: Totem
    description: Plant a device that fights beside you.
    targeting: ground
    cast_mode: cast
    cast_time: 0.8
    costs: { mana: 14 }
    cooldown: 2
    attributes: { range: 8, summon.count: 1, summon.max: 2, duration: 12 }
    mechanisms: [construct, spell, duration]
    tags: [spell, construct, totem]
    max_glyphs: 3
    ai: { role: summon, preferred_range: 6, weight: 0.5 }

  - id: snare
    name: Snare
    description: Lay a snare that springs on the first foe to step near.
    targeting: ground
    cast_mode: instant
    costs: { stamina: 10 }
    cooldown: 1.5
    attributes: { range: 6, summon.count: 1, summon.max: 3, duration: 20 }
    mechanisms: [construct, duration]
    tags: [trap, construct, mobile]
    min_threads: 0
    max_threads: 1
    max_glyphs: 2

  # What a sprung snare looses: the blast, all at once, since a trap springs the moment a foe steps near.
  - id: snare_blast
    name: Snare Blast
    description: A detonation at a point, all at once.
    targeting: ground
    cast_mode: instant
    costs: { mana: 12 }
    attributes: { range: 12, area.radius: 2.5, base_damage: 16 }
    mechanisms: [area, spell, hit]
    tags: [spell, area]
    drop_weight: 0
    effects:
      - type: area
        shape: circle
        radius: "weave.area.radius"
        center: point
        filter: enemy
        effects:
          - { type: damage, amount: "weave.base_damage * spell.power", threads: $threads }
          - { type: apply_status, status: $thread_status, chance: 0.3, threads: $threads }

  - id: dome
    name: Dome
    description: Raise a dome that catches what flies at you.
    targeting: self
    cast_mode: cast
    cast_time: 0.6
    costs: { mana: 18 }
    cooldown: 10
    attributes: { range: 0, summon.count: 1, summon.max: 1, duration: 8, area.radius: 3.5 }
    mechanisms: [construct, spell, duration]
    tags: [spell, construct, dome]
    max_glyphs: 2

  - id: command
    name: Command
    description: An order to your minions, given where you point.
    targeting: ground
    cast_mode: instant
    costs: { mana: 6 }
    cooldown: 6
    attributes: { range: 30 }
    mechanisms: [orders]
    tags: [minion, command, mobile]
    min_threads: 0
    max_threads: 1
    max_glyphs: 2
