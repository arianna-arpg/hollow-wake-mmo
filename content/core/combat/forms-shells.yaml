# Shells: the forms the ported presets compose on. A shell carries targeting, cast mode, mechanisms and the
# structural tags of one delivery, and reads its cast time, cooldown, costs and mobility from attributes the
# preset sets (cast.time, cooldown.base, cost.base.<resource>, cost.pct_max.<resource>, cast.move; the
# channel.*, guard.*, reserve.* and upkeep.* families for held modes and toggles), so one shell serves every
# preset of its kind. A shell has no graph of its own: the preset carries it. A codex that teaches a bare shell
# teaches nothing to cast, so these shells have zero drop weight and authored rewards must name a preset. One shell per delivery and cast mode; a shell is added
# only where no composition expresses a delivery, never for one preset.
kind: forms
entries:
  # ---- melee
  - id: swing
    name: Swing
    description: A weapon blow swept from the attacker's edge; the preset says how wide and how hard.
    targeting: direction
    cast_mode: cast
    cast_time: weave.cast.time
    cooldown: weave.cooldown.base
    cast_move: weave.cast.move
    costs: { stamina: "weave.cost.base.stamina + stamina.max * weave.cost.pct_max.stamina" }
    attributes: { cast.time: 0.6, cooldown.base: 0, cost.base.stamina: 6, range: 1.8, damage.effectiveness: 1 }
    mechanisms: [attack, hit, melee]
    tags: [attack, melee]
    min_threads: 0
    max_threads: 2
    max_glyphs: 4
    ai: { role: damage, preferred_range: 1.7, weight: 1 }
    drop_weight: 0
    effects: []

