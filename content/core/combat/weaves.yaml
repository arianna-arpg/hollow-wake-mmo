# Preset weaves: named compositions for Callings, monsters and onboarding. Players compose their own.
kind: weaves
entries:
  - { id: strike, name: Strike, form: strike, threads: [], color: "#9c8b72" }
  - { id: cleave, name: Cleave, form: cleave, threads: [], color: "#9c8b72" }
  - { id: ember_strike, name: Ember Strike, form: strike, threads: [ember], glyphs: [emberbind], color: "#e8622a" }
  - { id: ember_bolt, name: Ember Bolt, form: bolt, threads: [ember], color: "#e8622a" }
  - { id: tide_bolt, name: Tide Bolt, form: bolt, threads: [tide], color: "#3aa6d8" }
  - { id: storm_bolt, name: Storm Bolt, form: bolt, threads: [storm], glyphs: [echo], color: "#b58cff" }
  - { id: storm_nova, name: Storm Nova, form: nova, threads: [storm], color: "#b58cff" }
  - { id: ember_blast, name: Ember Blast, form: blast, threads: [ember], color: "#e8622a" }
  - { id: stone_blast, name: Stone Blast, form: blast, threads: [stone], color: "#9c8b72" }
  - { id: umbra_field, name: Umbra Field, form: field, threads: [umbra], color: "#5a4a7a" }
  - { id: bloom_mend, name: Bloom Mend, form: mend, threads: [bloom], color: "#5fbf5a" }
  - { id: lumen_ward, name: Lumen Ward, form: ward, threads: [lumen], color: "#f5e27a" }
  - { id: mind_lash, name: Mind Lash, form: beam, threads: [mind], color: "#d470c0" }
  - { id: void_lash, name: Void Lash, form: beam, threads: [void], color: "#2b2033" }
  - { id: quick_dash, name: Quick Dash, form: dash, threads: [], color: "#3aa6d8" }
  - { id: rallying_shout, name: Rallying Shout, form: shout, threads: [], color: "#f5e27a" }
  - id: call_remnant
    name: Call Remnant
    form: summon
    threads: [umbra]
    color: "#5a4a7a"
    effects:
      - { type: summon, pattern: remnant_shade, count: "weave.summon.count", duration: "weave.duration", max_active: "weave.summon.max", group: remnants }
  - id: call_sprig
    name: Call Sprig
    form: summon
    threads: [bloom]
    color: "#5fbf5a"
    effects:
      - { type: summon, pattern: sprig, count: "weave.summon.count", duration: "weave.duration", max_active: "weave.summon.max", group: sprigs }

  # ---- monster kits
  - { id: bite, name: Bite, form: strike, threads: [], color: "#8a6d3b", attributes: { damage.effectiveness: 0.9 } }
  - { id: claw, name: Claw, form: strike, threads: [], color: "#8a6d3b", attributes: { damage.effectiveness: 1.1 } }
  - { id: gore, name: Gore, form: cleave, threads: [], color: "#8a6d3b" }
  - { id: venom_spit, name: Venom Spit, form: bolt, threads: [bloom], color: "#5fbf5a", attributes: { base_damage: 9 } }
  - { id: cinder_spit, name: Cinder Spit, form: bolt, threads: [ember], color: "#e8622a", attributes: { base_damage: 10 } }
  - { id: brine_bolt, name: Brine Bolt, form: bolt, threads: [tide], color: "#3aa6d8", attributes: { base_damage: 10 } }
  - { id: grave_touch, name: Grave Touch, form: strike, threads: [umbra], color: "#5a4a7a" }
  - { id: howl, name: Howl, form: nova, threads: [mind], color: "#d470c0", attributes: { base_damage: 8, area.radius: 4 } }
  - { id: unmaking_pulse, name: Unmaking Pulse, form: nova, threads: [void], color: "#2b2033", attributes: { base_damage: 22, area.radius: 4.5 } }
  - { id: tangle_lash, name: Tangle Lash, form: beam, threads: [void, umbra], color: "#2b2033", attributes: { base_damage: 10 } }
