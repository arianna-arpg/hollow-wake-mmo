# Forms of the cast modes: channels with ramps and releases, charge-ups, overcharges, guards, timed strikes,
# banks of uses with a restringing convert, and toggles. Numbers are in world units and seconds.
kind: forms
entries:
  - id: torrent
    name: Torrent
    description: A held stream of thread that swells the longer it pours and breaks over the foe when let go.
    targeting: direction
    cast_mode: channel
    costs: { mana: 3 }
    cooldown: 4
    attributes: { range: 6, area.radius: 6, base_damage: 7 }
    mechanisms: [spell, hit, area]
    tags: [spell, area, channel]
    max_glyphs: 3
    ai: { role: damage, preferred_range: 4.5, weight: 1 }
    # Points from the weave's level (rule casting.tree_points), one per rank.
    tree:
      opens_at: 2
      nodes:
        - { id: swelling, name: Swelling, description: The stream runs wider., ranks: 3, modifiers: [ { attribute: area.radius, form: increased, value: 0.08 } ] }
        - { id: quick_pour, name: Quick Pour, description: The beats come sooner., links: [ swelling ], ranks: 2, modifiers: [ { attribute: cast.speed, form: increased, value: 0.06 } ] }
        - { id: broad_stream, name: Broad Stream, description: The stream fans out to a wide arc., links: [ swelling ], excludes: [ quick_pour ], patches: [ { type: area, where: first, set: { angle: 90 } } ] }
        - { id: still_water, name: Still Water, description: Pouring steadies the one who pours., links: [ quick_pour, broad_stream ], glyph: bastion }
    channel:
      interval: 0.5
      windup: 0.3
      move: 0.5
      max_hold: 3
      cooldown_on_end: true
      track_aim: true
      turn_rate: 240
      ramps:
        - { attribute: damage, form: more, per: 0.2, max: 0.6 }
        - { attribute: move.speed, form: more, per: -0.15, min: -0.45, on: caster }
      release:
        min_hold: 1
        effects:
          - type: area
            shape: circle
            radius: "weave.area.radius * 0.5 * (1 + cast.held * 0.2)"
            center: source
            filter: enemy
            effects:
              - { type: damage, amount: "weave.base_damage * spell.power * (1 + cast.held * 0.5)", threads: $threads }
              - { type: apply_status, status: $thread_status, chance: 0.5, threads: $threads }
    effects:
      - type: area
        shape: cone
        angle: 60
        radius: "weave.area.radius"
        center: source
        filter: enemy
        effects:
          - { type: damage, amount: "weave.base_damage * spell.power", threads: $threads, can_crit: false }

  - id: gathering
    name: Gathering
    description: Draw thread into a held brim without loosing it; let go to cast it all, harder the fuller the brim, and the brim keeps a little of what was gathered.
    targeting: direction
    cast_mode: channel
    costs: { mana: 2 }
    cooldown: 2
    attributes: { range: 14, base_damage: 15, projectile.count: 1, projectile.speed: 15, projectile.pierce: 1 }
    mechanisms: [spell, projectile, hit]
    tags: [spell, projectile, channel]
    ai: { role: damage, preferred_range: 9, weight: 0.8 }
    channel:
      interval: 0.4
      move: 0.6
      max_hold: 3
      cooldown_on_end: true
      brim: { fill_time: 2, decay: 0.15, bank_at: 0.4, min_release: 0.2, auto_release: true, scale: { at_empty: 0.6, at_full: 1.8, curve: quad_out } }
      release: { pulses: false, min_hold: 0.3 }
    effects:
      - type: projectile
        on_hit:
          - { type: damage, amount: "weave.base_damage * spell.power", threads: $threads }

  - id: drawn_shot
    name: Drawn Shot
    description: Draw the thread taut and loose it; the longer the draw, the harder and faster it flies.
    targeting: direction
    cast_mode: charge
    costs: { stamina: 8 }
    attributes: { range: 16, base_damage: 12, projectile.count: 1, projectile.speed: 18, projectile.pierce: 0 }
    mechanisms: [projectile, attack, hit]
    tags: [attack, projectile, ranged]
    min_threads: 0
    max_threads: 1
    ai: { role: damage, preferred_range: 10, weight: 1 }
    charge:
      max_time: 1.2
      full_hold: 0.4
      scales:
        - { attribute: damage, form: more, at_zero: -0.4, at_full: 0.8 }
        - { attribute: projectile.speed, form: increased, at_zero: 0, at_full: 0.5 }
        - { attribute: projectile.pierce, form: flat, at_zero: 0, at_full: 1 }
    effects:
      - type: projectile
        on_hit:
          - { type: damage, amount: "weave.base_damage * attack.power * (1 + 0.08 * (weave.level - 1))", threads: $threads }

  - id: surge
    name: Surge
    description: Hold the thread through rising stages; each stage banks more power, and a release on the beat sparks.
    targeting: ground
    cast_mode: overcharge
    costs: { mana: 8 }
    cooldown: 3
    attributes: { range: 11, area.radius: 2.4, base_damage: 13 }
    mechanisms: [spell, area, hit]
    tags: [spell, area]
    ai: { role: damage, preferred_range: 8, weight: 0.8 }
    overcharge:
      stages: 3
      time: 0.45
      full_hold: 0.5
      cost_per_stage: { mana: 4 }
      per_stage:
        - { attribute: damage, form: more, value: 0.35 }
        - { attribute: area.radius, form: increased, value: 0.15 }
      spark: { window: 0.2, bonus: 0.3 }
    effects:
      - type: area
        shape: circle
        radius: "weave.area.radius"
        center: point
        filter: enemy
        effects:
          - { type: damage, amount: "weave.base_damage * spell.power", threads: $threads }
          - { type: apply_status, status: $thread_status, chance: "0.2 + cast.stage * 0.15", threads: $threads }

  - id: bulwark
    name: Bulwark
    description: Brace behind bound thread; what strikes the front is caught, and what is caught is struck back.
    targeting: self
    cast_mode: guard
    costs: { stamina: 10 }
    cooldown: 5
    attributes: { range: 0, area.radius: 2.6, damage.effectiveness: 1.2 }
    mechanisms: [melee, area, hit]
    tags: [guard, melee, area]
    min_threads: 0
    max_threads: 1
    max_glyphs: 3
    ai: { role: defense, preferred_range: 1.5, weight: 0.6, when: "life_pct < 0.7" }
    guard:
      arc: 140
      pool: "life.max * 0.35"
      move: 0.3
      turn_rate: 180
      parry: 0.2
      max_duration: 2.5
      bash:
        threshold: 0.2
        arm_time: 0.5
        on_break: true
        effects:
          - type: area
            shape: cone
            angle: 120
            radius: "weave.area.radius"
            center: source
            filter: enemy
            effects:
              - { type: damage, amount: "(lerp(weapon.damage.min, weapon.damage.max, rand()) + guard.absorbed * 0.5) * weave.damage.effectiveness * attack.power", threads: $threads }
              - { type: apply_status, status: stunned, duration: 0.8 }
    # Raising the guard draws the foes in front of it.
    effects:
      - type: area
        shape: cone
        angle: 120
        radius: 3
        center: source
        filter: enemy
        effects:
          - { type: taunt, duration: 1.5 }

  - id: brace
    name: Brace
    description: Pour mana into a raised guard; a reflex, so it lands while the guard is held, and only then.
    targeting: self
    cast_mode: instant
    reflex: true
    costs: { mana: 15 }
    cooldown: 4
    attributes: { range: 0 }
    tags: [guard]
    min_threads: 0
    max_threads: 1
    gates: [ 'has("guarding")' ]
    effects:
      - { type: guard, amount: "30 * (1 + weave.level * 0.1)", self: true }

  - id: measured_strike
    name: Measured Strike
    description: A blow with a beat to it; pressing again in the last moment of the swing lands it flawless.
    targeting: enemy
    cast_mode: cast
    cast_time: "weapon.attack.time * 1.4"
    costs: { stamina: 6 }
    attributes: { range: 2, damage.effectiveness: 1.3 }
    mechanisms: [hit, melee, attack]
    tags: [attack, melee]
    min_threads: 0
    max_threads: 1
    max_glyphs: 3
    ai: { role: damage, preferred_range: 1.6, weight: 0.7 }
    timing: { kind: perfect, window: 0.25, bonus: 0.6 }
    effects:
      - type: damage
        amount: "lerp(weapon.damage.min, weapon.damage.max, rand()) * weave.damage.effectiveness * attack.power"
        threads: $threads
        tags: [hit]

  - id: quiver
    name: Quiver
    description: Loose bolts from a quiver of bound thread; when it runs empty, the same key restrings it.
    targeting: direction
    cast_mode: instant
    costs: { stamina: 3 }
    cooldown: 2.5
    attributes: { range: 14, base_damage: 9, projectile.count: 1, projectile.speed: 20, projectile.pierce: 0 }
    mechanisms: [projectile, attack, hit]
    tags: [attack, projectile, ranged]
    min_threads: 0
    max_threads: 1
    ai: { role: damage, preferred_range: 9, weight: 1 }
    uses: { max: 4, recharge: 2.5 }
    convert: { when: "slot.uses < 1", weave: quiver_restring }
    effects:
      - type: projectile
        on_hit:
          - { type: damage, amount: "weave.base_damage * attack.power", threads: $threads }

  - id: restring
    name: Restring
    description: Restring a spent quiver.
    targeting: self
    cast_mode: cast
    cast_time: 0.8
    attributes: { range: 0 }
    mechanisms: [utility]
    tags: [utility, mobile]
    min_threads: 0
    max_threads: 0
    max_glyphs: 0
    effects:
      - { type: restore_uses, scope: host }

  - id: vigil
    name: Vigil
    description: Keep a ward of thread burning about you; it holds back part of your mana and draws a little more each second.
    targeting: self
    cast_mode: instant
    costs: { mana: 5 }
    cooldown: 1
    attributes: { range: 0, duration: 600 }
    mechanisms: [buff, spell]
    tags: [spell, buff, aura, mobile]
    max_glyphs: 2
    ai: { role: defense, preferred_range: 0, weight: 0.3, when: "life_pct < 0.8" }
    toggle:
      on_deactivate:
        - { type: remove_status, status: fortified, self: true }
    reserve: { mana: "mana.max * 0.2" }
    upkeep: { per_second: { mana: 0.6 }, ramp: 0.02 }
    effects:
      - { type: apply_status, status: fortified, duration: "weave.duration", self: true }
