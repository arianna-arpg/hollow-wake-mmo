---
# How hard each ported ailment bites when a hit inflicts it through its chance family, as a fraction of the hit
# per second (the prototype's hit magnitudes); burning and bleeding keep their core rules.
kind: rules
entries:
  - id: combat
    patch: true
    values:
      ailment_magnitude:
        poison: "amount * 0.3"
        hemorrhage: "amount * 0.45"
        doom: "amount * 0.4"
        scorch: "amount * 0.25"
        wither_agony: "amount * 0.45"
        decay: "amount * 0.35"
        torment: "amount * 0.3"
        contagion: "amount * 0.3"
