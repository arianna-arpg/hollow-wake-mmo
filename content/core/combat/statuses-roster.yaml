# The rest of the prototype roster, ported into the Threads vocabulary: ailments that tick, debuffs that build into
# worse ones, states the AI reads as flags, and the blessings skills grant. Each is a composition of the status
# mechanics (statuses.md); the port ledger says what each one was. Physical is Stone, chaos is Umbra by theme or
# Void, and a status with no element keeps its tags plain.
kind: statuses
entries:
  - id: flamewreathed
    name: Flame-Wreathed
    tags: [ailment, ember, dot]
    duration: 1.2
    stack_policy: strongest
    baseline: "4 + level * 1.4"
    tick: { interval: 0.5, effects: [{ type: damage, amount: amount, threads: [ember], tags: [dot], can_crit: false }] }
    keep_source: true
    color: "#ffb547"
  - id: starfire
    name: Star-Seared
    tags: [ailment, ember, dot]
    duration: 1.1
    stack_policy: strongest
    baseline: "6 + level * 1.8"
