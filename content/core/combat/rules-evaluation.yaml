# Evaluation rules: the pairings a seeded tournament fights, how a duel is staged, how many fights a run takes, and
# the bands a matched pairing must stay inside (docs/design/evaluation.md). The harness reads every one of them from
# here and has no value of its own; validation refuses a rule it does not read. Times are seconds, distances metres;
# rates and floors are fractions. Bands are for pairings built to be even, such as the proving pairs; an uneven
# pairing is measured but not banded.
kind: rules
entries:
  - id: evaluation
    values:
      # The proving pairs, each written a:b with two pattern ids: matched pairings built to be even, which a
      # tournament fights unless told otherwise.
      proving_pairs:
        - "proving_reaver:proving_bulwark"
        - "proving_hexer:proving_plaguer"
        - "proving_pitfighter:proving_mower"
        - "proving_fletcher:proving_evoker"
      # The standard duels, written the same way: the pairings whose seeded traces are the determinism baseline
      # (tournament --standard; the recorded hashes are experiments/combat-grammar/baselines/standard-duels.json).
      standard_duels:
        - "wolf:hob"
        - "loosed_skirmisher:hob"
        - "loosed_skirmisher:boar"
        - "loosed_kindler:boar"
        - "tide_channeler:spark_duelist"
        - "proving_reaver:proving_bulwark"
        - "loosed_skirmisher:tide_caller"
      # How a duel is staged: the two bodies spawn this far apart, mirrored about the arena's origin, under these two
      # factions, a's then b's, which a duel adds to the registry, hostile to each other, only where it lacks them.
      # hollowwake fight stages its duels the same way.
      spawn_distance: 4
      factions: ["red", "blue"]
      # The fights per pairing and the cap a run takes unless the command names others (or a baseline it checks).
      seeds: 10
      seconds: 60
      # The median time to kill over the fights that ended.
      ttk_min: 5
      ttk_max: 45
      # The share of fights either side may win, and the share that may end in a draw: both bodies standing at the
      # cap, or both dead after the tick the first one fell in (a double knockout).
      win_rate_ceiling: 0.8
      draw_ceiling: 0.2
      # The share of its kit's seats each side must use, averaged over its fights: its coverage.
      coverage_floor: 0.25
