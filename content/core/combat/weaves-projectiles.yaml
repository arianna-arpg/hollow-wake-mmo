# Projectiles and bows: the prototype's flights ported as presets on the missile and shot shells
# (forms-shells.yaml). Each preset carries its graph: a projectile with its hit shape, firing style and the
# trajectory axes as weave attributes in our units (degrees a second), the riders the prototype gave it, and what
# it does where it ends: a burst, a lingering field, a sequel cast, a spawn, a catch. A missile reads the preset's
# base_damage with spell.power; a shot reads the weapon's dice times damage.effectiveness with attack.power. The
# munitions carry their banks and reloads through the preset seam. The port ledger (docs/design/parity/port-ledger.md)
# says what each one was and what changed. The payloads at the end are reached by casts from other weaves.
kind: weaves
