    description: "Heave a gout of living melt in a lazy arc: it bursts in fire damage where it lands and leaves a burning pool for 3.2 seconds. Every hit carries a 45% chance to burn."
    form: missile
    threads: [ember]
    tags: [duration]
    color: "#ff7a2a"
    attributes:
      cast.time: 0.7
      cooldown.base: 0.8
      cost.base.mana: 10
      base_damage: 18
      range: 14.38
      projectile.speed: 5.94
    ai: { role: damage, preferred_range: 13.44, weight: 3 }
    effects:
      - type: projectile
        radius: 0.31
        on_hit:
          - type: damage
            threads: $threads
            amount: "weave.base_damage * lerp(0.78, 1.22, roll) * spell.power * (1 + 0.08 * (weave.level - 1))"
          - { type: apply_status, status: burning, chance: 0.45, magnitude: "last_damage * 0.5" }
          - type: area
            radius: 1.88
            center: point
            filter: enemy
            include_center: false
            effects:
              - type: damage
                threads: $threads
                amount: "weave.base_damage * lerp(0.78, 1.22, roll) * spell.power * (1 + 0.08 * (weave.level - 1)) * 0.7"
        on_expire:
          - type: area
            radius: 1.88
            center: point
            filter: enemy
            effects:
              - type: damage
                threads: $threads
                amount: "weave.base_damage * lerp(0.78, 1.22, roll) * spell.power * (1 + 0.08 * (weave.level - 1)) * 0.7"
        on_end:
          - type: field
            radius: 1.94
            duration: 3.2
            interval: 0.5
            radius_curve: { from: 1, to: 0.15, curve: linear }
            pulse:
              - type: damage
                threads: $threads
                amount: "weave.base_damage * lerp(0.78, 1.22, roll) * spell.power * (1 + 0.08 * (weave.level - 1)) * 0.4"
                can_crit: false
