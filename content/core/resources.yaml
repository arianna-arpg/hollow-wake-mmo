# Resources: current/maximum pairs with regeneration. Damage pools are ordered by combat.pools in rules and
# what each does (absorb, break, delay, re-arm) is combat.pool_rules. A body holds a pool only where it has a
# maximum for it, so a shield or poise exists only where authored or granted.
kind: resources
entries:
  - { id: life, name: Life, max: life.max, regen: life.regen, lethal: true, color: "#c0392b", order: 0 }
  - { id: mana, name: Mana, max: mana.max, regen: mana.regen, color: "#2e86de", order: 1 }
  - { id: stamina, name: Stamina, max: stamina.max, regen: stamina.regen, color: "#27ae60", order: 2 }
  - { id: ward, name: Ward, max: ward.max, regen: ward.regen, start_fraction: 1, color: "#f1c40f", order: 3 }
  - { id: shield, name: Shield, max: shield.max, regen: shield.recharge, start_fraction: 1, color: "#8fd3ff", order: 4 }
  - { id: poise, name: Poise, max: poise.max, regen: poise.regen, start_fraction: 1, color: "#d9b25a", order: 5 }
