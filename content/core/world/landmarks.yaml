# Landmarks: hand-authored stamps. Rows read top to bottom as north to south; '.' keeps natural terrain.
# Digits in a legend are half-step heights (1 = 0.5, 2 = 1.0 ...) so stairs climb within the step limit.
# A layer cell adds a surface above the ground instead of replacing it, which is how bridges and floors work.
kind: landmarks
entries:
  - id: hamlet_ring
    name: Hamlet
    anchor_x: 10
    anchor_y: 10
    rows:
      - "......###########......"
      - "....##...........##...."
      - "...#...HH.....HH...#..."
      - "..#....HH.....HH....#.."
      - "..#.................#.."
      - ".#....=============..#."
      - ".#....=...........=..#."
      - ".#....=..W.....A..=..#."
      - ".#....=...........=..#."
      - ".#....=.....Q.....=..#."
      - ".#....=...........=..#."
      - ".#....=..L.....G..=..#."
      - ".#....=...........=..#."
      - ".#....=============..#."
      - "..#.................#.."
      - "..#....HH.....HH....#.."
      - "...#...HH.....HH...#..."
      - "....##.....=.....##...."
      - "......#####=#####......"
      - "...........=..........."
    legend:
      "#": { height: 1.6, walkable: false, tags: [wall, structure] }
      "H": { height: 2.4, walkable: false, tags: [house, roof] }
      "=": { height: 0, walkable: true, tags: [road, paved] }
      "W": { height: 0.4, walkable: false, tags: [well], spawn: null }
      "A": { height: 0, walkable: true, tags: [paved], spawn: anvil }
      "L": { height: 0, walkable: true, tags: [paved], spawn: loom }
      "Q": { height: 0, walkable: true, tags: [paved], spawn: quartermaster }
      "G": { height: 0, walkable: true, tags: [paved], spawn: spindlewatch_guard }

