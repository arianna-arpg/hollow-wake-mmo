# How things look (docs/design/appearance.md). Read by the clients only; the simulation never sees this file.
#
# A body entry is found by an entity's look id first (a pattern's look, which is its id unless it names
# another; a Calling's look; drop:<item base>), then by the pattern's tags: the entry whose match tags the
# pattern all carries with the highest priority wins. A gear entry has a slot and is found by the worn item's
# class and tags the same way. Families are the builders both clients implement; everything else here is a
# number or a colour a mod can patch. Colours follow the visual language: broad painted planes, matte limestone,
# cloth that catches light at the hem, brass at joints, no Thread locked to a hue.
kind: ui_appearances
entries:
  # ---------------------------------------------------------------- fallbacks, lowest priority, by what a thing is
  - id: creature_fallback
    match: [creature]
    priority: -10
    body: biped
    palette: { skin: "#b89a7a", cloth: "#6b5f52", leather: "#55463a", metal: "#8c8c90", accent: "#b89a67", eyes: "#2a2622" }
  - id: beast_fallback
    match: [beast]
    priority: -5
    body: quadruped
    palette: { hide: "#8a6d4b", belly: "#c2a98a", hoof: "#3a2e24", horn: "#d9cfb5", eyes: "#1b1612" }
  - id: humanoid_fallback
    match: [humanoid]
    priority: -5
    body: biped
    palette: { skin: "#c8a888", hair: "#4a3828", cloth: "#75685a", cloth2: "#5c4f44", leather: "#55463a", metal: "#8c8c90", accent: "#b89a67", eyes: "#2a2622" }
  - id: prop_fallback
    match: [prop]
    priority: -10
    body: rock
    palette: { stone: "#8c8a7a" }
  - id: flora_fallback
    match: [flora]
    priority: -10
    body: bush
    palette: { leaf: "#5f7a46", leaf2: "#7f9a5c" }
  - id: device_fallback
    match: [device]
    priority: -10
    body: totem
    palette: { wood: "#6b5236", band: "#b89a67", face: "#d9cfb5" }

