# How bodies move and how feedback lands (docs/design/appearance.md), read by both clients. Every number is
# cosmetic: the swing's anticipation is scaled to the server's cast progress and its release follows the cast's
# end on the wire; nothing here lengthens or moves a gameplay window. Times are seconds, angles are degrees,
# distances are world units or fractions of the body's height where named so.
kind: ui_motion
entries:
  - id: default
    walk: { stride: 1.5, swing: 38, bob: 0.035, lean: 6, arm_swing: 28, run_speed: 5 }
    idle: { breath: 0.02, rate: 0.55, sway: 1.5, look: 8 }
    swing: { anticipation: 70, release: 0.16, follow: 85, recovery: 0.3, lean: 10 }
    cast: { gather: 0.6, raise: 35, release: 0.2, recovery: 0.35, channel_sway: 6 }
    hit: { flinch: 0.14, lean: 14, flash: 0.16, flash_mix: 0.65, knock_lean: 18, squash: 0.08 }
    death: { fall: 0.55, settle: 0.5, sink: 0.25, fade_after: 20, fade: 2 }
    camera: { follow_iso: 10, follow_third: 14, zoom_ease: 9, shake_hit: 0.12, shake_crit: 0.25, shake_death: 0.35, shake_time: 0.28, shake_rate: 28 }
    combat_text: { base: 1, big: 1.8, crit: 1.3, heavy_fraction: 0.12, rise: 1.3 }
    labels: { prop_reach: 7, fade: 0.25 }
    contact: { opacity: 0.35, hostile: teeth, friendly: ticks, neutral: plain }
