# Station services: work a station does for a price. The type names a registered service; at names the
# interactable kinds or station tags that offer it; accepts narrows what it works on by item tags; the price is
# an expression per currency of the hero and the target (item_level, rarity_rank, sockets, refunds).
kind: station_services
entries:
  - id: raise_stone
    name: Raise a stone
    type: level_item
    at: [font]
    accepts: [glyph]
    order: 0
    price: { shards: "6 + item_level * item_level * 2" }
    description: Raises a glyph stone one level, socketed or loose.
  - id: raise_codex
    name: Raise a codex
    type: level_item
    at: [font]
    accepts: [codex]
    order: 1
    price: { shards: "10 + item_level * item_level * 3" }
    description: Raises a codex one level, learned or loose.
  - id: merge_codices
    name: Merge codices
    type: merge_codices
    at: [font]
    accepts: [codex]
    order: 2
    price: { shards: "25 * (rarity_rank + 1) * (rarity_rank + 1)" }
    description: Two copies of a codex become one of the next rarity, which holds another glyph.
  - id: reset_passives
    name: Reset passives
    type: reset_passives
    at: [font]
    order: 3
    price: { shards: "20 + level * 6 + refunds * 2" }
    description: Returns every passive point bought; the calling's start and realm roots stay.
  - id: chisel_socket
    name: Chisel a socket
    type: add_socket
    at: [smithing]
    order: 4
    price: { shards: "15 + item_level * 2 + sockets * sockets * 40" }
    description: Cuts one more socket into a piece of gear, up to what its kind can hold.
